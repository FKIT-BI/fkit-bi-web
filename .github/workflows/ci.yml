name: CI and Dev delivery
on:
  pull_request: {branches: [develop]}
  push: {branches: [develop]}
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: fkit-bi-web-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test && npm run typecheck && npm run build
      - run: docker build -t fkit-bi-web:${{ github.sha }} .
  publish:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/fkit-bi/fkit-bi-web:dev,ghcr.io/fkit-bi/fkit-bi-web:${{ github.sha }}
      - name: Report disabled Dev deployment
        if: vars.FKIT_BI_DEV_DEPLOY_ENABLED != 'true'
        run: echo 'Dev deployment is disabled by FKIT_BI_DEV_DEPLOY_ENABLED.' >> "$GITHUB_STEP_SUMMARY"
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.FKIT_BI_DEV_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FKIT_BI_DEV_HOST: ${{ vars.FKIT_BI_DEV_HOST }}
      FKIT_BI_DEV_SSH_USER: ${{ vars.FKIT_BI_DEV_SSH_USER }}
      FKIT_BI_DEV_SSH_PORT: ${{ vars.FKIT_BI_DEV_SSH_PORT }}
      FKIT_BI_DEV_DEPLOY_PATH: ${{ vars.FKIT_BI_DEV_DEPLOY_PATH }}
      FKIT_BI_DEV_SSH_KNOWN_HOSTS: ${{ vars.FKIT_BI_DEV_SSH_KNOWN_HOSTS }}
    steps:
      - name: Load Web deployment credentials from Infisical
        uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.FKIT_BI_INFISICAL_IDENTITY_ID }}
          domain: https://secrets.kitexp.ru
          project-slug: ${{ vars.FKIT_BI_INFISICAL_PROJECT_SLUG }}
          env-slug: dev
          secret-path: /github-actions/web
      - name: Deploy Web image
        env:
          GH_TOKEN: ${{ secrets.FKIT_BI_GITHUB_TOKEN }}
        run: gh repo clone FKIT-BI/fkit-bi-infra ../infra -- --branch develop
      - name: Apply Web image
        run: ../infra/scripts/deploy-service.sh web ghcr.io/fkit-bi/fkit-bi-web:${{ github.sha }} ${{ github.sha }}
      - name: Report Web delivery
        run: 'echo "Web image deployed: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"'
